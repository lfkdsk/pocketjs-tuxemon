name: CI

# Re-import Tuxemon from the pinned upstream commit and check that the
# committed project, maps, art and battle data are exactly what the importer
# produces; then typecheck, build, run the tests, the import audits and the
# maintained journeys, and play the opening journey in headless Chrome
# against the built web site. The checks run as parallel jobs, each starting
# from the shared prepare action; the web site is kept as an artifact and is
# published to GitHub Pages from main once every job passes
# (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    name: Import, typecheck and determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
        with:
          build: "false"
      - name: The committed output is exactly what the importer produces
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Two isolated imports are byte-identical
        run: bun run verify:g6:determinism
      - name: zh_CN translation supplement checks
        run: bun run check:l10n
      - name: CJK subset covers every zh_CN character
        run: bun run check:cjk

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Explicit groups of roughly a minute each: bun's --shard cuts the
        # sorted file list into contiguous runs, which bunches the slow
        # battle and replay suites together. New test files land in "rest".
        include:
          - name: importer
            files: tests/importer.test.ts
          - name: replays
            files: tests/g7-repository.test.ts tests/g6-golden.test.ts
          - name: locks, battle data and terrain
            files: tests/g6-locks.test.ts tests/battle-db-adapter.test.ts tests/battle-golden.test.ts tests/terrain.test.ts
          - name: rest
            files: rest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - name: Test
        run: |
          files="${{ matrix.files }}"
          if [ "$files" = rest ]; then
            files=$(ls tests/*.test.ts | grep -v -E '(importer|g7-repository|g6-golden|g6-locks|battle-db-adapter|battle-golden|terrain)\.test\.ts$')
          fi
          bun test $files

  journey:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The frozen 30.5-minute source tape folds in about a minute on CI.
          # Full 60/30/20 alignment, save/load and rewind checks remain in
          # `bun run verify:gb6:full` for the release/acceptance gate.
          - name: Route 3 battle journey at 60 Hz
            run: bun run verify:gb6:mainline
          # J1 is stored as a standalone continuation, but CI concatenates its
          # input masks with GB6 and replays from frame zero so the snapshot
          # cannot hide a historical divergence.
          - name: Captain-return journey from frame zero at 60 Hz
            run: bun run verify:j1:mainline
          # J2 concatenates all three segments' input masks and replays from
          # frame zero; stateful, rewind and multi-rate checks stay in
          # `bun run verify:j2:full`.
          - name: Hospital-cure journey from frame zero at 60 Hz
            run: bun run verify:j2:mainline
          # J3 adds its input-only continuation and replays all four segments
          # from frame zero through the Omnichannel Radio Tower broadcast.
          - name: Radio-broadcast journey from frame zero at 60 Hz
            run: bun run verify:j3:mainline
          # J4 additionally replays its continuation twice from the exact J3
          # production-save boundary, then replays all five segments from
          # frame zero through the Kernel/Billie Data Center epilogue.
          - name: Kernel-quest journey from J3 save and frame zero
            run: bun run verify:j4:mainline
          - name: Battle defeat and recovery journeys
            run: bun run verify:gb6:failures
          - name: Every imported input lock is executed to its unlock
            run: bun run verify:g6:locks
          - name: No map can freeze the player
            run: bun run verify:g6:frozen
          - name: Chapter snapshots and thumbnails
            run: bun run verify:chapters
          # Five saves along GB6 (two runs, one crossing noon) each load and
          # finish the tape at the uninterrupted terminal state.
          - name: Save mid-journey, load, finish the tape
            run: bun run verify:save
          # Sandboxed neighbour preview at every chapter: no mainline event
          # rejected, the live state never written.
          - name: Neighbour preview coverage at every chapter
            run: bun run verify:preview:coverage
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  web:
    name: Web site and headless Chrome journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
      - name: Build the web site
        run: bun run web
      - name: Play the journey in headless Chrome
        run: bun tools/verify-web-journey.ts
      - name: Play the zh_CN opening in headless Chrome
        run: bun tools/verify-web-zh.ts
      - name: Play the demo controls in headless Chrome
        run: bun tools/verify-web-demo.ts
      - name: Play three imported music tracks in headless Chrome
        run: bun run verify:web:audio
      - name: Keep the web site
        uses: actions/upload-artifact@v7
        with:
          name: web-site
          path: dist/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/web
      - name: Keep the journey screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-journey
          path: dist/web-journey/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the demo screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-demo
          path: dist/web-demo/*.png
          retention-days: 14
          if-no-files-found: ignore

  psp:
    name: PSP release package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The runner image ships clang-18 but not the LLVM binutils the PSP
      # toolchain also needs (llvm-ar, llvm-ranlib, llvm-objcopy); the llvm-18
      # package installs them next to clang under /usr/lib/llvm-18/bin.
      POCKETJS_LLVM_BIN: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare
        with:
          build: "false"
      - name: Cache the pinned PSP toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/pocket-nexus
          key: ${{ runner.os }}-pocketjs-psp-${{ hashFiles('vendor/pocket-rpgkit/vendor/pocketjs/tools/cli/psp-toolchain.json') }}
      - name: Install the LLVM binutils
        run: sudo apt-get update && sudo apt-get install -y llvm-18
      - name: Install and verify the pinned PSP toolchain
        working-directory: vendor/pocket-rpgkit/vendor/pocketjs
        run: bun run bootstrap
      - name: Build the PSP release package
        run: bun run build:psp --skip-assets
      - name: Keep the PSP release package
        uses: actions/upload-artifact@v7
        with:
          name: psp-release
          path: |
            dist/psp/EBOOT.PBP
            dist/psp/assets.pak
            dist/psp/pocket-tuxemon.prx
            dist/psp/AUDIO-ATTRIBUTIONS.md
            dist/psp/build-receipt.json
          retention-days: 14

  deploy:
    # The PSP package is built and kept as an artifact but does not gate the
    # Pages deploy.
    needs: [import, test, journey, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
